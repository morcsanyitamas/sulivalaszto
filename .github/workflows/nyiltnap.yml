# Nyíltnap-kereső: naponta végignézi az iskolák honlapját, és frissíti a nyiltnap.json-t,
# amit az oldal betölt. Kézzel is indítható az Actions fülön (Run workflow).
name: Nyíltnap-kereső

on:
  schedule:
    - cron: "17 4 * * *"   # minden nap 4:17 UTC (6:17 nyári / 5:17 téli idő)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nyiltnap
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Honlapok átnézése
        run: node tools/nyiltnap.mjs

      - name: Eredmény mentése
        run: |
          git config user.name "nyiltnap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nyiltnap.json
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "nyíltnap-kereső: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
            # a GITHUB_TOKEN-nel küldött push nem mindig indít Pages-buildet, ezért kérjük külön
            gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || echo "Pages-build kérése nem sikerült"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
